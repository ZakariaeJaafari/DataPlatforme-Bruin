# NYC Taxi ELT pipeline — ingestion → staging → reports (local DuckDB)

name: nyc-taxi-pipeline
schedule: monthly
start_date: "2022-01-01"
catchup: false

default_connections:
  duckdb: duckdb-default

variables:
  # TLC taxi types to ingest (used by pipeline/assets/ingestion/trips.py).
  # For faster dev runs: --var 'taxi_types=["yellow"]'
  taxi_types:
    type: array
    items:
      type: string
    default:
      - yellow
      - green
